name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (tests, Pint, API types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('apps/backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test --compact

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: API types are up to date
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm api:types
          git diff --exit-code packages/api-types || (echo "::error::packages/api-types is stale — run 'pnpm api:types' and commit the result." && exit 1)

  storefront:
    name: Storefront (types, lint, build, E2E)
    runs-on: ubuntu-latest
    env:
      APP_ENV: local # seeds the demo catalogue the E2E tests buy from
      STOREFRONT_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_ASSET_ORIGIN: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('apps/backend/composer.lock') }}

      - name: Start backend
        working-directory: apps/backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan storage:link
          nohup php artisan serve --host=127.0.0.1 --port=8000 > ../../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: apps/storefront
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: apps/storefront
        run: pnpm lint

      - name: Build
        working-directory: apps/storefront
        run: pnpm build

      - name: Start storefront
        working-directory: apps/storefront
        # No --hostname: with it next-intl's default-locale rewrite loops (see docs/DEPLOY.md).
        run: |
          nohup pnpm start --port 3100 > ../../storefront.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done

      - name: Install Playwright browser
        working-directory: apps/storefront
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: apps/storefront
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
            backend.log
            storefront.log
          retention-days: 7
